<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Three quick anonymous questions — about a minute.">
  <title>Live Poll</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/participant.css">
  <script src="/config.js"></script>
  <script type="module" src="/js/participant.js"></script>
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <div class="view view-center">
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">Please enable JavaScript to take part in the poll.</p></noscript>
</body>
</html>
